/* --- Notee / Mapas de ideias v1.1 ------------------------------------------ */
.graph-page{max-width:1940px;padding:30px 32px 34px}
.graph-page .page-heading{margin-bottom:21px}
.graph-board-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:15px}
.graph-board-head p{margin-top:6px}
.graph-board-select{width:min(340px,100%);font-size:17px;font-weight:620;letter-spacing:-.35px;padding:9px 36px 9px 13px;border-radius:10px;border-color:#dce5d5;background:#fff;box-shadow:0 2px 10px #153a2010}
.graph-toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:11px 14px;border:1px solid var(--line);border-bottom:0;border-radius:15px 15px 0 0;background:#fcfef9}
.graph-toolbar .btn.compact{padding:9px 12px}
.graph-tool-active{background:#edf5e7!important;border-color:#a8bf9b!important;color:var(--brand)!important}
.graph-connection-hint{font-size:11px;padding:7px 10px;color:#496742;background:#eff5e8;border:1px solid #cbdcc2;border-radius:7px}
.graph-zoom-btn{font-size:19px;font-weight:550;border:1px solid var(--line);background:#fff;line-height:1}
.graph-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:610px;border-radius:0 0 15px 15px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.graph-surface{height:clamp(600px,69vh,790px);position:relative;background-color:#f9fbf7;background-image:radial-gradient(#cad9c4 1px,transparent 1px);background-size:23px 23px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;isolation:isolate}
.graph-surface.is-panning{cursor:grabbing}
.graph-stage{position:absolute;left:0;top:0;width:6400px;height:6400px;transform-origin:0 0;will-change:transform}
.graph-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.graph-edge{pointer-events:stroke}
.graph-edge-line{fill:none;stroke:#a5baa0;stroke-width:2.25;stroke-linecap:round}
.graph-edge.edge-related .graph-edge-line{stroke:#6d9977;stroke-width:2.6}
.graph-edge-hit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer;pointer-events:stroke}
.graph-edge-label-bg{fill:#fff;stroke:#d4dfcf;stroke-width:1;pointer-events:none}
.graph-edge-text{font-size:11px;fill:#5d7555;font-family:var(--font);font-weight:550;pointer-events:none}
.graph-doubt-wire{fill:none;stroke:#d3be8d;stroke-width:1.5;stroke-dasharray:4 5;pointer-events:none}
.graph-note{width:206px;height:124px;position:absolute;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;padding:12px 13px 10px;border:1px solid #d8e3d4;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 7px 24px #1e3d2310;cursor:grab;user-select:none;overflow:visible;transition:box-shadow .15s,border-color .15s,background .15s}
.graph-note:hover{border-color:#91b18b;box-shadow:0 12px 28px #1b40241a}
.graph-note:active{cursor:grabbing}
.graph-note.selected{border:2px solid #386b45;padding:11px 12px 9px;box-shadow:0 0 0 4px #dff0d7,0 12px 30px #1d50211a}
.graph-note.context-selected{background:#eff7ea;border-color:#80a877}
.graph-note.selected.context-selected{background:#eaf3e2}
.graph-note-top{display:flex;align-items:center;gap:7px;width:100%;min-height:23px}
.graph-note-symbol{width:23px;height:23px;border-radius:7px;background:#eaf2e2;color:#376c41;display:flex;align-items:center;justify-content:center;flex:none}
.graph-note-category{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8c9a86}
.graph-context-check{display:flex;margin-left:auto;color:#21573d}
.graph-note-title{font-size:14px;line-height:1.2;letter-spacing:-.16px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.graph-note-summary{font-size:10px;line-height:1.55;color:#7a8974;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.graph-note-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eff3ed;padding-top:5px;color:#869381;font-size:10px}
.graph-note-foot span{display:inline-flex;align-items:center;gap:5px}
.graph-note-foot .icon{width:12px;height:12px}
.graph-connector{position:absolute;right:-6px;top:51px;background:#b2d091;border:2px solid #fff;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px #b8cbaa;pointer-events:none}
.graph-doubt{position:absolute;width:174px;height:52px;display:flex;align-items:center;gap:9px;overflow:hidden;text-align:left;padding:7px 10px;border:1px solid #e7d9b6;background:#fffdf5;border-radius:10px;color:#755927;box-shadow:0 5px 14px #4736150e;cursor:pointer}
.graph-doubt:hover,.graph-doubt.selected{border-color:#bd9b50;background:#fff8df;box-shadow:0 0 0 3px #f3e6c1}
.graph-doubt-symbol{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#faeecd}
.graph-doubt-content{display:flex;flex-direction:column;min-width:0;gap:1px}
.graph-doubt-content strong{font-size:10px}
.graph-doubt-content small{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9a885f}
.graph-viewport-help{position:absolute;left:16px;bottom:13px;max-width:calc(100% - 32px);font-size:10px;color:#879780;background:#ffffffdf;border:1px solid #e3e9dc;border-radius:8px;padding:6px 10px;display:flex;gap:7px;align-items:center;pointer-events:none;z-index:3}
.graph-map-legend{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:center;padding:8px 11px;background:#ffffffdd;border:1px solid #e6ebe1;border-radius:8px;font-size:10px;color:#718369;pointer-events:none;z-index:3}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;background:#c6ddbb;border:1px solid #8da981}
.legend-dot.amber{background:#f5e2a8;border-color:#c9aa6a;margin-left:8px}
.legend-line{width:18px;border-top:2px solid #a5baa0;display:inline-block;margin-left:8px}
.graph-side{min-width:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;max-height:clamp(600px,69vh,790px)}
.graph-side-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);flex:none}
.graph-side-tabs button{border:0;background:#fafcf8;color:#7d8977;padding:14px 5px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:550;border-bottom:2px solid transparent}
.graph-side-tabs button.active{background:#fff;color:var(--brand);border-bottom-color:var(--brand)}
.graph-side-scroll{padding:21px;overflow-y:auto;flex:1;scrollbar-color:#cbd9c4 #fff}
.graph-inspector-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.graph-inspector-top .btn{padding:5px 7px;font-size:10px}
.graph-panel-title{font-size:21px;margin:16px 0 10px;letter-spacing:-.6px;line-height:1.3}
.graph-panel-section{padding:18px 0;border-top:1px solid #edf2e8;margin-top:17px}
.graph-panel-section h4{font-size:12px;display:flex;align-items:center;gap:8px}
.graph-panel-section>.row .btn{font-size:10px;padding:6px 8px}
.graph-panel-preview{font-size:12px;line-height:1.75;white-space:pre-wrap;max-height:170px;overflow-y:auto;color:#536b50;margin-top:10px}
.graph-ref-list{display:flex;flex-direction:column;gap:10px;margin-top:11px}
.graph-ref-item{display:flex;align-items:flex-start;gap:6px;border:1px solid #e7ede3;background:#fcfdfb;border-radius:9px;padding:10px}
.graph-ref-item strong{font-size:11px;display:block;font-weight:600;line-height:1.35}
.graph-ref-item .tiny{display:block;margin-top:4px}
.graph-ref-item .icon-btn{width:24px;height:24px}
.graph-ref-url{font-size:10px;color:var(--brand);display:inline-flex;align-items:center;gap:3px;margin-top:5px;text-decoration:underline}
.graph-ref-url .icon{width:11px;height:11px}
.graph-list-question,.graph-relation-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #f0f3eb;padding:11px 0;color:#53654d;font-size:11px}
.graph-list-question:hover,.graph-relation-item:hover{color:var(--brand);background:#f7faf4}
.graph-list-question span{flex:1}
.graph-relation-item{justify-content:space-between}
.graph-inspector-empty{text-align:center;padding:70px 12px;color:#8b9982}
.graph-inspector-empty .icon{color:#9db58f;width:31px;height:31px}
.graph-inspector-empty h3{margin-top:17px;color:#455e43}
.graph-inspector-empty p{font-size:12px;line-height:1.6;margin-top:10px}
.graph-ai-intro{display:flex;align-items:flex-start;gap:12px;margin:2px 0 19px}
.graph-ai-intro h3{font-size:15px;letter-spacing:-.2px}
.graph-ai-intro p{font-size:11px;line-height:1.55;color:#84937d;margin-top:4px}
.graph-ai-icon{background:#eaf3dd;color:#427244;border-radius:12px;width:37px;height:37px;display:flex;align-items:center;justify-content:center;flex:none}
.graph-suggestion{margin-top:12px;background:#f8fbf5;border:1px solid #dce9d4;border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:9px}
.graph-suggestion strong{font-size:12px}
.graph-suggestion p{font-size:11px;line-height:1.5;color:#6d8067}
.graph-scope-switch{display:flex;gap:3px;background:#f1f5ec;border:1px solid #e6eddf;border-radius:9px;padding:3px;margin-top:14px}
.graph-scope-switch button{flex:1;border:0;background:none;padding:9px 6px;font-size:10px;color:#728267;border-radius:6px}
.graph-scope-switch button.active{background:#fff;color:var(--brand);font-weight:620;box-shadow:0 2px 7px #22432410}
.graph-context-stat{padding:12px 0 15px;margin-top:9px;font-size:12px;color:#76866f}
.graph-context-stat strong{font-size:16px;color:var(--brand)}
.graph-context-stat span{margin:0 7px}
.graph-context-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.graph-json-preview{max-height:430px;overflow:auto;max-width:100%;padding:19px;border:1px solid #e4eadc;background:#f7faf5;border-radius:11px;font-size:10px;line-height:1.6;color:#35523c;white-space:pre-wrap;overflow-wrap:anywhere}
.graph-bottom-note{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:10px;color:#8c9a84;flex-wrap:wrap}
.graph-bottom-note span{margin-left:auto}
@media(max-width:1360px){.graph-page{padding:24px}.graph-layout{grid-template-columns:minmax(0,1fr) 296px}.graph-side-scroll{padding:15px}.graph-toolbar .btn.compact{padding:7px 9px}}

/* --- Notee / Acessibilidade do espaco de trabalho v1.2 ------------------- */
/* Estado global do menu; o conteudo dos documentos nao e alterado por estas regras. */
.sidebar-brand{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:24px;min-height:36px}
.sidebar-brand .logo{margin:0;padding:0 6px;white-space:nowrap}
.sidebar-collapse-button{flex:none;width:31px;height:31px;border:1px solid #e0e8d9;background:#fff;color:var(--brand)}
.sidebar-collapse-button:hover{background:#eef5e8}
.sidebar .nav-item{min-height:40px}
.sidebar-collapsed .sidebar{width:72px;padding:21px 10px 13px}
.sidebar-collapsed .main-wrap{margin-left:72px;width:calc(100% - 72px)}
.sidebar-collapsed .sidebar-brand{flex-direction:column;gap:14px;margin-bottom:25px}
.sidebar-collapsed .sidebar-brand .logo{font-size:0;letter-spacing:0;padding:0}
.sidebar-collapsed .sidebar-brand .logo-mark{font-size:24px;margin:0;letter-spacing:-2px}
.sidebar-collapsed .sidebar-brand .logo>span:not(.logo-mark){display:none}
.sidebar-collapsed .sidebar .workspace,
.sidebar-collapsed .sidebar .nav-label,
.sidebar-collapsed .sidebar .local-note,
.sidebar-collapsed .sidebar .nav-item span,
.sidebar-collapsed .sidebar .user-switch .grow{display:none}
.sidebar-collapsed .sidebar .nav-item{width:100%;min-height:43px;justify-content:center;padding:10px 0;margin:5px 0}
.sidebar-collapsed .sidebar .nav-item .icon{width:19px;height:19px}
.sidebar-collapsed .sidebar .user-switch{flex-direction:column;gap:9px;align-items:center;padding-top:13px;margin-top:10px}
.sidebar-collapsed .sidebar .user-switch .avatar{width:32px;height:32px}
.sidebar-collapsed .sidebar .user-switch .icon-btn{width:31px;height:31px}
.sidebar-collapsed .sidebar nav{min-height:0;overflow-y:auto;scrollbar-width:none}
.sidebar-collapsed .sidebar nav::-webkit-scrollbar{display:none}

/* Divisorias utilizaveis por ponteiro ou teclado. */
.pane-resizer{position:relative;width:10px;min-width:10px;cursor:col-resize;touch-action:none;outline:none;align-self:stretch;z-index:2}
.pane-resizer::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:#dfe8d9;transition:background .16s}
.pane-resizer::after{content:"";position:absolute;left:1px;top:calc(50% - 25px);width:8px;height:50px;border:1px solid #ceddc9;background:#f9fcf6;border-radius:8px;box-shadow:0 2px 9px #24492c12}
.pane-resizer:hover::before,.pane-resizer:focus-visible::before,.pane-resizer.is-resizing::before{background:#3e7951}
.pane-resizer:hover::after,.pane-resizer:focus-visible::after,.pane-resizer.is-resizing::after{background:#dbeccf;border-color:#659a67}
.pane-resizer:focus-visible{outline:3px solid #8fb68b;outline-offset:3px;border-radius:5px}
body.pane-is-resizing,body.pane-is-resizing *{cursor:col-resize!important;user-select:none!important}
.editor-page{max-width:1840px;padding:32px 32px 52px}
.editor-page .page-heading{margin-bottom:22px}
.editor-layout{display:grid;grid-template-columns:minmax(380px,1fr) 10px minmax(270px,var(--editor-aside-width,316px));gap:0;align-items:start}
.editor-layout>.editor-main-card{min-width:0;overflow:hidden}
.editor-layout>.editor-side{min-width:0;gap:16px}
.editor-resizer{min-height:580px;margin:0}
.editor-layout .editor-body{padding:27px 30px 36px}
.editor-layout .editor-title{font-size:28px!important}
.editor-side .card.pad{padding:20px}
.editor-side .result-panel{padding:19px}

/* Faixa de perguntas da nota: horizontal, pequena e rolavel; expansao no fluxo. */
.editor-doubt-area{margin-bottom:22px}
.editor-doubt-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 0 9px}
.editor-doubt-heading strong{font-size:12px;font-weight:630;color:#3e5644}

  if(job.status==='failed')return 'Pesquisa não concluída. Abra para tentar novamente.';
  if(job.status==='cancelled')return 'Pesquisa cancelada.';
  if(['queued','running'].includes(job.status))return 'Pesquisa simulada em andamento.';
  return 'Aguardando pesquisa ou resposta.';
}
function renderDoubtStrip(note){
  const jobs=state.jobs.filter(job=>job.noteId===note.id);
  if(!jobs.some(job=>job.id===editorExpandedDoubt))editorExpandedDoubt=null;
  const expanded=jobs.find(job=>job.id===editorExpandedDoubt);
  return `<section class="editor-doubt-area" aria-label="Dúvidas e respostas desta nota">
    <div class="editor-doubt-heading"><div class="row gap8"><span class="doubt-heading-icon">${icon('question','sm')}</span>
      <div><strong>Dúvidas e respostas</strong><span class="tiny muted"> ${jobs.length} nesta nota · deslize para navegar</span></div></div>
      <div class="row gap8"><button class="icon-btn doubt-scroll-control" data-action="scroll-doubts" data-direction="-1" aria-label="Ver dúvidas anteriores" title="Voltar dúvidas">‹</button>
      <button class="icon-btn doubt-scroll-control" data-action="scroll-doubts" data-direction="1" aria-label="Ver próximas dúvidas" title="Avançar dúvidas">›</button></div></div>
    ${jobs.length?`<div class="editor-doubt-track" id="editor-doubt-track" role="group" aria-label="Perguntas da nota">
      ${jobs.map(job=>`<button type="button" class="editor-doubt-card ${expanded?.id===job.id?'is-open':''}" data-action="toggle-doubt-strip" data-id="${esc(job.id)}" aria-expanded="${expanded?.id===job.id}" aria-controls="editor-doubt-expanded">
        <strong class="editor-doubt-question" title="${esc(job.question)}">${esc(job.question)}</strong>
        <span class="editor-doubt-answer" title="${esc(noteDoubtPreview(job))}">${esc(noteDoubtPreview(job))}</span></button>`).join('')}
    </div>`:`<div class="editor-doubt-empty">Nenhuma dúvida nesta nota. Selecione um trecho no editor para marcar sua primeira pergunta.</div>`}
    ${expanded?`<section class="editor-doubt-expanded card" id="editor-doubt-expanded" aria-label="Resposta expandida">
      <div class="row between mb16"><strong>Detalhes da dúvida selecionada</strong><button class="btn compact ghost" data-action="toggle-doubt-strip" data-id="${esc(expanded.id)}" aria-label="Recolher resposta">${icon('close','sm')} Fechar</button></div>
      <div class="editor-doubt-detail">${renderResearchDetail(expanded,true)}</div></section>`:'<section id="editor-doubt-expanded" hidden></section>'}
  </section>`;
}

function renderEditor(id){const n=nBy(id);if(!n)return shell(emptyMissing());const jobs=state.jobs.filter(j=>j.noteId===id);let selectedJob=rBy(currentResearch)||jobs[0];if(selectedJob?.noteId!==id)selectedJob=jobs[0];const archive=n.status!=='active';return shell(`${pageHead(esc(n.title),`Nota ${archive?'fora da lista ativa':'privada'} \u00b7 revis\u00e3o v${n.version} \u00b7 atualizada em ${fmt(n.updated)}`,`<a href="#/history/${id}" class="btn">${icon('clock')}Hist\u00f3rico</a><a href="#/publish/${id}" class="btn">${icon('globe')}Publicar</a>`,'NOTAS / '+esc(catName(n.category)))}<div id="editor-doubt-zone">${renderDoubtStrip(n)}</div>${archive?'<div class="callout warning mb24">'+icon('archive')+'<span>Nota '+(n.status==='trashed'?'na lixeira':'arquivada')+'. Restaure-a antes de editar ou pesquisar.</span></div>':''}<div class="editor-layout" style="--editor-aside-width:${uiPrefs.editorAsideWidth}px"><section class="card editor-main-card"><div class="toolbar"><div class="row gap8"><select id="new-block-type" aria-label="Tipo de bloco"><option value="paragraph">Par\u00e1grafo</option><option value="heading">T\u00edtulo</option><option value="list">Lista</option><option value="quote">Cita\u00e7\u00e3o</option><option value="code">C\u00f3digo</option></select><button class="icon-btn" data-action="add-block" data-id="${id}" aria-label="Adicionar bloco">${icon('plus')}</button></div><button class="btn compact" data-action="mark-selection" data-id="${id}">${icon('question','sm')}Marcar como d\u00favida</button></div><div class="editor-body" data-note="${id}"><div class="row between"><span class="pill">${icon('lock','sm')}Rascunho privado</span><span class="tiny muted">Blocos edit\u00e1veis</span></div><input class="editor-title" id="editor-title" value="${esc(n.title)}" aria-label="T\u00edtulo da nota" ${archive?'readonly':''}><div class="editor-meta"><select id="editor-category" aria-label="Categoria da nota"><option value="">Sem categoria</option>${state.categories.map(c=>`<option value="${c.id}" ${c.id===n.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<button class="btn ghost compact" data-action="edit-tags" data-id="${id}">${icon('tag','sm')}Tags</button></div><div id="editor-blocks">${n.blocks.map(b=>renderBlock(n,b)).join('')}</div><p class="editor-hint">${icon('info','sm')}Selecione uma palavra ou frase. O texto original continua sendo seu.</p></div><div class="editor-status"><span id="save-state">${icon('check','sm')} Salvo localmente</span><span>${n.blocks.map(b=>b.text).join(' ').split(/\s+/).length} palavras \u00b7 v${n.version}</span></div><div class="row between" style="padding:15px 18px;border-top:1px solid var(--line)"><div class="row gap8"><button class="btn ghost compact" data-action="archive-note" data-id="${id}">${icon('archive','sm')}Arquivar</button><button class="btn ghost compact" data-action="trash-note" data-id="${id}" aria-label="Mover para lixeira">${icon('trash','sm')}</button></div><button class="btn primary compact" data-action="save-note" data-id="${id}">${icon('save','sm')}Salvar altera\u00e7\u00f5es</button></div></section><div class="pane-resizer editor-resizer" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Redimensionar espaço de escrita e painel de curiosidade" aria-valuemin="270" aria-valuemax="900" aria-valuenow="${uiPrefs.editorAsideWidth}" title="Arraste para ajustar ou use as teclas de seta" data-resize-pane="editor"></div><aside class="stack editor-side"><div class="card pad"><div class="aside-title">${icon('spark')}<strong>Assistente de curiosidade</strong></div><p class="small muted mb16">Sugest\u00f5es para conectar o que voc\u00ea escreveu ao que ainda quer descobrir.</p><div class="field" style="margin-bottom:12px"><label for="note-auto">Pesquisa autom\u00e1tica nesta nota</label><select id="note-auto" data-id="${id}"><option value="inherit" ${n.auto==='inherit'?'selected':' function detectSuggestions(n){const result=[];for(const b of n.blocks){const sentences=b.text.match(/[^.!?\n]+[?]/g)||[];for(const text of sentences){const q=text.trim();if(!state.jobs.some(j=>j.noteId===n.id&&j.quote===q)&&!state.dismissed.includes(n.id+q))result.push({blockId:b.id,quote:q})}}if(!result.length){const b=n.blocks.find(x=>x.type==='paragraph');if(b){const match=b.text.match(/\b(Outbox|Worker|idempot\u00eancia|serendipidade|transa\u00e7\u00e3o|persist\u00eancia)\b/i);if(match&&!state.jobs.some(j=>j.noteId===n.id&&j.quote===match[0])&&!state.dismissed.includes(n.id+match[0]))result.push({blockId:b.id,quote:match[0]})}}return result.slice(0,2)}
function renderAnalysis(n){const sug=detectSuggestions(n);return`<div class="divider"></div><div class="small muted mb16">An\u00e1lise local por palavras-chave, n\u00e3o por IA.</div>${sug.length?sug.map((s,i)=>`<div class="analysis-suggestion"><span class="pill green">Poss\u00edvel d\u00favida</span><p>${esc(s.quote)}</p><div class="row gap8"><button class="btn compact" data-action="accept-suggestion" data-id="${n.id}" data-index="${i}">Marcar</button><button class="btn ghost compact" data-action="dismiss-suggestion" data-id="${n.id}" data-index="${i}">Ignorar</button></div></div>`).join(''):'<p class="small muted mb16">Nenhuma nova pergunta reconhecida neste exemplo. A marca\u00e7\u00e3o manual continua dispon\u00edvel.</p>'}<div class="analysis-suggestion"><span class="pill">Organiza\u00e7\u00e3o sugerida</span><p>${suggestOrganization(n).categoryLabel}<br><span class="tag">${suggestOrganization(n).tag}</span></p><button class="btn compact" data-action="apply-organization" data-id="${n.id}">${icon('check','sm')}Aplicar sugest\u00e3o</button></div>`}
function suggestOrganization(n){const text=norm(n.title+' '+n.blocks.map(b=>b.text).join(' '));return /banco|sistema|api|worker|codigo|dotnet/.test(text)?{category:'c1',categoryLabel:'Desenvolvimento',tag:'sistemas-distribuidos'}:/leitura|palavra|livro/.test(text)?{category:'c2',categoryLabel:'Leituras e perguntas',tag:'aprendizado'}:{category:'c3',categoryLabel:'Ideias',tag:'para-explorar'}}
function renderResearch(id){const j=id?rBy(id):null;if(j)return shell(`${pageHead('Da pergunta \u00e0 informa\u00e7\u00e3o','O que foi pesquisado, em qual contexto e com quais fontes.',`<a href="#/note/${j.noteId}" class="btn">${icon('back')}Voltar \u00e0 nota</a>`,'D\u00daVIDAS / DETALHE')}<div class="split"><section class="card pad" id="full-research">${renderResearchDetail(j)}</section><aside class="stack"><div class="card pad"><h3>Contexto preservado</h3><p class="small muted mt16">${esc(nBy(j.noteId)?.title)}</p><div class="divider"></div><div class="small">Revis\u00e3o ${j.revision}</div><p class="small muted mt16">A resposta \u00e9 um registro separado. Editar a nota n\u00e3o reescreve a pesquisa j\u00e1 conclu\u00edda.</p><a href="#/history/${j.noteId}" class="btn compact mt16">${icon('clock','sm')}Ver hist\u00f3rico</a></div><div class="card pad"><h3>Cen\u00e1rios de interface</h3><p class="small muted mt16">Exercite os estados sem usar um servi\u00e7o externo.</p><div class="stack mt16" style="gap:9px"><button class="btn compact" data-action="simulate-nosource" data-id="${j.id}">Simular \u201cSem fonte\u201d</button><button class="btn compact" data-action="simulate-failure" data-id="${j.id}">Simular falha do provider</button></div></div></aside></div>`,'research','Pesquisa');
 const list=activeJobs().filter(j=>researchFilter==='all'||(researchFilter==='pending'&&j.status==='pending')||(researchFilter==='completed'&&j.status==='completed')||(researchFilter==='none'&&j.evidence==='none'));
 return shell(`${pageHead('Toda pergunta merece um lugar.','Encontre suas d\u00favidas, acompanhe pesquisas e revise as respostas.',`<a href="#/settings" class="btn">${icon('settings')}Automa\u00e7\u00e3o</a>`,'D\u00daVIDAS E PESQUISAS')}<div class="callout neutral mb24">${icon('shield')}<span>Aqui, todas as pesquisas s\u00e3o simuladas. Na aplica\u00e7\u00e3o final, o Worker busca na web e registra fontes, contexto e limites.</span></div><div class="tabbar">${[['all','Todas'],['pending','Para pesquisar'],['completed','Conclu\u00eddas'],['none','Sem fonte']].map(([v,l])=>`<button class="tab ${researchFilter===v?'active':''}" data-action="research-filter" data-value="${v}">${l}</button>`).join('')}</div>${list.length?`<div class="table-wrap"><table><thead><tr><th>D\u00daVIDA</th><th>NOTA DE ORIGEM</th><th>ESTADO</th><th>A\u00c7\u00c3O</th></tr></thead><tbody>${list.map(j=>`<tr><td style="max-width:330px"><strong>${esc(j.quote)}</strong><div class="tiny muted mt16" style="margin-top:5px">${fmt(j.created)} \u00b7 v${j.revision}</div></td><td style="max-width:210px"><a href="#/note/${j.noteId}">${esc(nBy(j.noteId)?.title)}</a></td><td>${statusBadge(j)}${j.reviewed?'<div class="tiny muted" style="margin-top:5px">Revisada</div>':''}</td><td><a class="btn compact" href="#/research/${j.id}">Abrir ${icon('arrow','sm')}</a></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('question')}<h3>Nenhuma d\u00favida neste filtro</h3><p>Marque um trecho no editor para come\u00e7ar.</p><a href="#/notes" class="btn mt16">Abrir minhas notas</a></div>`}`,'research','D\u00favidas e pesquisas');
}
function renderCategories(){return shell(`${pageHead('Uma organiza\u00e7\u00e3o que faz sentido.','Uma categoria principal por nota. Quantas tags forem \u00fateis para conectar assuntos.',button(icon('plus')+'Nova categoria','new-category','primary'),'CATEGORIAS')}<div class="grid three">${state.categories.map(c=>{const qty=activeNotes().filter(n=>n.category===c.id).length;return`<div class="card category-card"><div class="row between"><div class="category-mark">${icon(c.icon,'lg')}</div><button class="icon-btn" data-action="edit-category" data-id="${c.id}" aria-label="Editar categoria">${icon('more')}</button></div><h2>${esc(c.name)}</h2><p>${qty} notas ativas</p><div class="mini-line"><span style="width:${qty/Math.max(activeNotes().length,1)*100}%"></span></div><button class="btn ghost compact mt16" data-action="view-category" data-id="${c.id}">Ver notas ${icon('arrow','sm')}</button></div>`}).join('')}</div><div class="card pad mt32"><div class="row between"><h3>Tags em uso</h3><span class="small muted">Classifica\u00e7\u00e3o livre</span></div><div class="row wrap mt16">${[...new Set(activeNotes().flatMap(n=>n.tags))].map(t=>`<button class="btn compact" data-action="search-tag" data-value="${esc(t)}">${icon('tag','sm')}${esc(t)}</button>`).join('')}</div></div><div class="callout neutral mt24">${icon('spark')}<span>O assistente pode sugerir categoria e tags a partir do texto. Nada ser\u00e1 aplicado sem voc\u00ea aceitar.</span></div>`,'categories','Categorias')}

function renderPublish(id){const n=nBy(id);if(!n)return shell(emptyMissing());const pub=state.publications.find(p=>p.noteId===id);return shell(`${pageHead('Compartilhe s\u00f3 o que faz sentido.',esc(n.title),`<a href="#/note/${id}" class="btn">${icon('back')}Voltar ao editor</a>`,'PUBLICAR NOTA')}<form id="publish-form" data-id="${id}" class="split"><section class="card pad"><h2>Uma c\u00f3pia p\u00fablica, sob seu controle.</h2><p class="small muted mt16">A publica\u00e7\u00e3o registra uma fotografia da revis\u00e3o v${n.version}. Novas edi\u00e7\u00f5es permanecem privadas at\u00e9 voc\u00ea atualizar a publica\u00e7\u00e3o.</p><div class="divider"></div><div class="field"><label for="publish-title">T\u00edtulo p\u00fablico</label><input id="publish-title" type="text" value="${esc(n.title)}" maxlength="160" required></div><div class="field"><label for="publish-visibility">Visibilidade</label><select id="publish-visibility"><option value="public" ${pub?.visibility==='public'?'selected':''}>P\u00fablica: aparece na biblioteca e no perfil</option><option value="unlisted" ${pub?.visibility==='unlisted'?'selected':''}>N\u00e3o listada: acess\u00edvel por quem tiver o link</option></select></div><div class="field"><label for="publish-slug">Identificador da publica\u00e7\u00e3o</label><input id="publish-slug" type="text" value="${esc(pub?.slug||norm(n.title).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))}" required pattern="[a-z0-9-]+"><span class="tiny muted">No prot\u00f3tipo, os links usam rotas locais. N\u00e3o h\u00e1 hospedagem p\u00fablica.</span></div><label class="check"><input type="checkbox" id="include-research"><span>Incluir respostas que marquei como revisadas<br><span class="tiny muted">Apenas respostas revisadas, com suas fontes ou o aviso \u201cSem fonte\u201d. D\u00favidas privadas n\u00e3o revisadas ficam de fora.</span></span></label><div class="callout warning mt24">${icon('eye')}<span>N\u00e3o listado n\u00e3o significa privado: o link pode ser repassado. Revisar a publica\u00e7\u00e3o \u00e9 sua decis\u00e3o.</span></div><div class="row mt24"><button class="btn primary" type="submit" ${n.status!=='active'?'disabled':''}>${icon('globe')}${pub?'Atualizar fotografia publicada':'Criar publica\u00e7\u00e3o'}</button>${pub?`<button class="btn danger" type="button" data-action="unpublish" data-id="${pub.id}">Retirar do ar</button>`:''}</div></section><aside class="stack"><div class="card pad"><span class="pill ${pub?'green':''}">${pub?'Publicada em v'+pub.revision:'Ainda privada'}</span><h3 class="mt16">Antes de publicar</h3><p class="small muted mt16">Confira o texto, remova informa\u00e7\u00f5es pessoais e escolha quais respostas fazem parte da vers\u00e3o p\u00fablica.</p>${pub?`<a class="btn compact mt16" href="#/public/${pub.id}">Abrir vers\u00e3o publicada ${icon('external','sm')}</a>`:''}</div><div class="callout neutral">${icon('shield')}<span>Sem curtidas, coment\u00e1rios, seguidores ou recomenda\u00e7\u00f5es sociais nesta etapa.</span></div></aside></form>`,'publications','Publicar nota')}

function renderPublications(){return shell(`${pageHead('O que voc\u00ea escolheu compartilhar.','Publique uma vers\u00e3o revisada da nota. Seu rascunho continua independente.',`<a href="#/profile/alex" class="btn">${icon('user')}Meu perfil p\u00fablico</a>`,'PUBLICA\u00c7\u00d5ES')}<div class="grid three">${state.publications.map(p=>`<div>${publicationCard(p)}<div class="row mt16"><a class="btn compact" href="#/publish/${p.noteId}">Gerenciar</a><button class="btn ghost compact" data-action="copy-public" data-id="${p.id}">${icon('copy','sm')}Copiar link local</button></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1"><h3>Nenhuma publica\u00e7\u00e3o</h3><p>Abra uma nota e escolha Publicar.</p></div>'}</div>`,'publications','Publica\u00e7\u00f5es')}

 mt24">Este \u00e9 um snapshot independente do rascunho privado. Nenhuma intera\u00e7\u00e3o social \u00e9 coletada.</p></article></main><footer class="public-footer">Notee \u00b7 Anote agora. Entenda depois. \u00b7 Prot\u00f3tipo local</footer>`}
function renderExplore(profile=false){const list=state.publications.filter(p=>p.visibility==='public');return `${publicHeader()}<main class="public-main">${profile?`<div class="row mb24"><span class="avatar big">AC</span><div><div class="overline">PERFIL P\u00daBLICO DEMONSTRATIVO</div><h1 class="mt16" style="margin-top:7px">Alex Costa</h1><p class="small muted mt16" style="margin-top:7px">Aprendendo em p\u00fablico, uma nota de cada vez.</p></div></div>`:`<div class="overline">BIBLIOTECA P\u00daBLICA</div><h1 class="mt16" style="font-size:40px">Ideias que ganharam o mundo.</h1><p class="public-intro">Um cat\u00e1logo simples de notas publicadas. Sem feed algor\u00edtmico, curtidas ou seguidores.</p>`}<div class="row between mt32 mb24"><h2>${profile?'Notas publicadas':'Para ler com calma'}</h2><span class="small muted">${list.length} publica\u00e7\u00e3o(\u00f5es)</span></div><div class="grid three">${list.map(publicationCard).join('')||'<div class="empty" style="grid-column:1/-1"><h3>A biblioteca ainda est\u00e1 vazia.</h3><p>Publique uma nota para v\u00ea-la aqui.</p></div>'}</div><div class="callout neutral mt32">${icon('info')}<span>Somente snapshots com visibilidade p\u00fablica aparecem nesta tela. Notas n\u00e3o listadas e rascunhos privados ficam de fora.</span></div></main><footer class="public-footer">Conhecimento compartilhado com inten\u00e7\u00e3o. Notee.</footer>`}
function renderSettings(){const s=state.settings;const sw=(key,label)=>`<button class="switch ${s[key]?'on':''}" role="switch" aria-checked="${s[key]}" aria-label="${label}" data-action="toggle-setting" data-key="${key}"></button>`;let body=settingTab==='account'?`<form class="card settings-section" id="account-form"><h2 class="mb24">Seu perfil local</h2><div class="field"><label for="account-name">Nome</label><input id="account-name" value="${esc(state.user.name)}" type="text" required></div><div class="field"><label for="account-email">E-mail de demonstra\u00e7\u00e3o</label><input id="account-email" value="${esc(state.user.email)}" type="email" required></div><div class="row"><button class="btn primary" type="submit">Salvar perfil local</button><a class="btn" href="#/forgot">Recupera\u00e7\u00e3o de senha</a></div></form>`:settingTab==='privacy'?`<div class="card settings-section"><h2 class="mb24">Privado por padr\u00e3o.</h2><div class="callout neutral mb24">${icon('shield')}<span>Este HTML n\u00e3o transmite notas nem senhas. Todo o armazenamento de demonstra\u00e7\u00e3o \u00e9 local, sem criptografia de aplicativo.</span></div><div class="settings-row"><div><h4>Retirar pesquisas externas</h4><p>O controle geral de pesquisas tem preced\u00eancia sobre qualquer prefer\u00eancia de nota. Aqui ele apenas desliga a simula\u00e7\u00e3o.</p></div>${sw('researchEnabled','Permitir simula\u00e7\u00f5es de pesquisa')}</div><div class="settings-row"><div><h4>Reiniciar demonstra\u00e7\u00e3o</h4><p>Remove suas altera\u00e7\u00f5es locais e recria os dados de exemplo.</p></div><button class="btn danger compact" data-action="reset-demo">Reiniciar dados</button></div></div>`:`<div class="card settings-section"><h2 class="mb24">Seu ritmo. Suas escolhas.</h2><div class="settings-row"><div><h4>Permitir pesquisas</h4><p>Chave geral. Desligada, bloqueia novas pesquisas em qualquer nota, mesmo que a automa\u00e7\u00e3o esteja ativada nela.</p></div>${sw('researchEnabled','Permitir pesquisas')}</div><div class="settings-row"><div><h4>Pesquisar automaticamente</h4><p>Aplica-se a d\u00favidas que voc\u00ea marcou ou aceitou. Sugest\u00f5es ainda n\u00e3o aceitas n\u00e3o geram pesquisas.</p></div>${sw('auto','Pesquisa autom\u00e1tica padr\u00e3o')}</div><div class="settings-row"><div><h4>Sugerir d\u00favidas, categoria e tags</h4><p>Use Analisar texto no editor. Aceite ou ignore cada sugest\u00e3o. O texto original n\u00e3o \u00e9 reescrito.</p></div>${sw('analysis','An\u00e1lise de texto')}</div><div class="settings-row"><div><h4>Provider</h4><p>Adaptador demonstrativo. Nenhum modelo comercial \u00e9 chamado neste arquivo.</p></div><span class="pill green">FakeResearchProvider</span></div><div class="settings-row"><div><h4>Limite desta demonstra\u00e7\u00e3o</h4><p>M\u00e1ximo de resultados ou tentativas iniciadas, contando os exemplos. No sistema real, limites ser\u00e3o transacionais e medidos por per\u00edodo.</p></div><input type="number" id="research-budget" min="1" max="100" value="${s.budget}" aria-label="Limite de simula\u00e7\u00f5es" style="width:90px"></div></div><div class="callout mt24">${icon('info')}<span><strong>Conta define o padr\u00e3o. Nota pode sobrescrever.</strong><br>Em cada nota: Herdar, Ativar ou Desativar. A chave geral e o limite sempre prevalecem. Ativar n\u00e3o pesquisa retroativamente suas d\u00favidas antigas.</span></div>`;if(settingTab==='layout')body=`<section class="card settings-section"><h2>Seu espaço, no seu tamanho.</h2><p class="small muted mt16">Arraste as divisórias no editor e no mapa; use as teclas de seta quando a divisória estiver selecionada. As preferências ficam neste navegador e não alteram suas notas.</p><div class="settings-row"><div><h4>Menu principal</h4><p>${uiPrefs.sidebarCollapsed?'Recolhido, mostrando apenas ícones.':'Expandido, mostrando nomes e ícones.'}</p></div><span class="pill green">${uiPrefs.sidebarCollapsed?'Compacto':'Expandido'}</span></div><div class="settings-row"><div><h4>Painel do editor</h4><p>Largura atual: ${uiPrefs.editorAsideWidth} pixels.</p></div><span class="pill">Ajustável</span></div><div class="settings-row"><div><h4>Painel do mapa</h4><p>Largura atual: ${uiPrefs.graphAsideWidth} pixels. ${uiPrefs.graphAsideHidden?'Oculto':'Visível'}.</p></div><span class="pill">Ajustável</span></div><div class="divider"></div><button class="btn" data-action="reset-layout">${icon('refresh','sm')} Restaurar layout padrão</button><p class="tiny muted mt16">Esta ação não exclui notas, dúvidas ou mapas.</p></section>`;return shell(`${pageHead('Um assistente do seu jeito.','Configure a organiza\u00e7\u00e3o e a pesquisa sem perder o controle sobre suas notas.','','CONFIGURA\u00c7\u00d5ES')}<div class="tabbar">${[['research','Intelig\u00eancia e pesquisas'],['account','Conta'],['privacy','Privacidade e dados'],['layout','Layout e acessibilidade']].map(([v,l])=>`<button class="tab ${settingTab===v?'active':''}" data-action="settings-tab" data-value="${v}">${l}</button>`).join('')}</div><div style="max-width:900px">${body}</div>`,'settings','Configura\u00e7\u00f5es')}
function renderAdmin(){const running=state.jobs.filter(j=>['running','queued'].includes(j.status)).length;return shell(`${pageHead('Entender o sistema tamb\u00e9m faz parte.','Painel ilustrativo de opera\u00e7\u00e3o. N\u00e3o h\u00e1 conex\u00e3o com servi\u00e7os reais.','','LABORAT\u00d3RIO / DIAGN\u00d3STICO')}<div class="callout warning mb24">${icon('shield')}<span>Valores de demonstra\u00e7\u00e3o, n\u00e3o medi\u00e7\u00f5es. Em produ\u00e7\u00e3o esta \u00e1rea exige permiss\u00e3o de operador; o HTML n\u00e3o implementa autoriza\u00e7\u00e3o.</span></div><div class="grid four">${[['API p95','142 ms','Exemplo de lat\u00eancia HTTP'],['Pesquisas em execu\u00e7\u00e3o',running,'Contagem local da simula\u00e7\u00e3o'],['Outbox pendente','0','Valor ilustrativo'],['Custo real de IA','N\u00e3o aplic\u00e1vel','Nenhuma API foi chamada']].map(x=>`<div class="card stat"><div class="stat-top">${x[0]}${icon('chart')}</div><div class="stat-number" style="font-size:${x[1].length>10?'18':'27'}px">${x[1]}</div><span class="stat-foot">${x[2]}</span></div>`).join('')}</div><div class="grid two mt24"><div class="card pad"><h3>Dura\u00e7\u00e3o de pesquisas \u00b7 exemplo</h3><div class="diagnostic-bars">${[35,48,40,65,47,78,62,38,50,71,54,45,65,48].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><p class="tiny muted mt16">O painel real vir\u00e1 de histogramas OpenTelemetry, n\u00e3o de tempos inventados no frontend.</p></div><div class="card pad"><h3>Sinais para investigar</h3><div class="list-item row between"><span class="small">Idade da mensagem mais antiga</span><span class="pill">Exemplo: 0 s</span></div><div class="list-item row between"><span class="small">Falhas do provider</span><span class="pill">${state.jobs.filter(j=>j.status==='failed').length} locais</span></div><div class="list-item row between"><span class="small">Respostas sem fonte</span><span class="pill amber">${state.jobs.filter(j=>j.evidence==='none').length}</span></div></div></div><div class="card pad mt24"><h3>Trace ilustrativo de uma pesquisa</h3><div class="steps">${['HTTP 202','Outbox','SQS','Worker','Busca web','Resposta salva'].map(t=>`<div class="step done">${t}</div>`).join('')}</div><p class="small muted">Use correla\u00e7\u00e3o entre os servi\u00e7os. N\u00e3o inclua texto privado, pergunta, e-mail ou tokens em atributos de telemetria.</p></div>`,'admin','Diagn\u00f3stico')}

/ 8 / 12 / 16 / 24 / 32 / 48 px</p><p class="small">Raios: 8 / 10 / 16 px. \u00cdcones: 16 / 18 / 24 px.</p></div></div><div class="callout mt24">${icon('code')}<span>Na migra\u00e7\u00e3o: design tokens em CSS, Tailwind como utilit\u00e1rio e componentes pr\u00f3prios sobre primitivas acess\u00edveis. O prot\u00f3tipo n\u00e3o depende de biblioteca externa.</span></div>`,'design-system','Design system')}

// Animation is illustrative and never triggers network or research requests.
const landingStages=['write','question','connect'];
let landingCycleId=null;
function selectLandingStage(stage){
  const frame=document.getElementById('nl-demo-frame');
  if(!frame||!landingStages.includes(stage))return;
  frame.dataset.stage=stage;
  frame.querySelectorAll('[data-scene]').forEach(el=>{
    const active=el.dataset.scene===stage;
    el.classList.toggle('is-active',active);
    el.setAttribute('aria-hidden',String(!active));
  });
  document.querySelectorAll('[data-landing-stage]').forEach(el=>{
    const active=el.dataset.landingStage===stage;
    el.setAttribute('aria-selected',String(active));
    el.tabIndex=active?0:-1;
  });
}
function initLanding(){
  if(landingCycleId){clearInterval(landingCycleId);landingCycleId=null}
  const root=document.getElementById('notee-landing');
  if(!root)return;
  const frame=document.getElementById('nl-demo-frame');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const restartCycle=()=>{
    if(landingCycleId){clearInterval(landingCycleId);landingCycleId=null}
    if(reduceMotion)return;
    landingCycleId=setInterval(()=>{
      if(!document.getElementById('nl-demo-frame')){clearInterval(landingCycleId);landingCycleId=null;return}
      if(document.hidden||frame.matches(':hover')||frame.matches(':focus-within'))return;
      const next=(landingStages.indexOf(frame.dataset.stage)+1)%landingStages.length;
      selectLandingStage(landingStages[next]);
    },6500);
  };
  root.querySelectorAll('[data-landing-stage]').forEach(button=>{
    button.addEventListener('click',()=>{selectLandingStage(button.dataset.landingStage);restartCycle()});
    button.addEventListener('keydown',event=>{
      if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight'&&event.key!=='Home'&&event.key!=='End')return;
      event.preventDefault();
      let index=landingStages.indexOf(frame.dataset.stage);
      if(event.key==='Home')index=0;
      else if(event.key==='End')index=landingStages.length-1;
      else index=(index+(event.key==='ArrowRight'?1:-1)+landingStages.length)%landingStages.length;
      const next=landingStages[index];
      selectLandingStage(next);
      root.querySelector('[data-landing-stage="'+next+'"]')?.focus();
      restartCycle();
    });
  });
  root.querySelectorAll('[data-nl-scroll]').forEach(button=>button.addEventListener('click',()=>{
    const target=document.getElementById(button.dataset.nlScroll);
    target?.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
  }));
  restartCycle();
}

function runJob(id,scenario='normal'){const j=rBy(id);if(!j)return;const n=nBy(j.noteId);if(!n||n.status!=='active'){toast('Pesquisas s\u00f3 s\u00e3o iniciadas em notas ativas.','info');return}if(!state.settings.researchEnabled){toast('Pesquisas bloqueadas pela configura\u00e7\u00e3o geral da conta.','info');return}if(['running','queued'].includes(j.status)){toast('Esta pesquisa j\u00e1 est\u00e1 em andamento.','info');return}if(state.jobs.filter(j=>j.status!=='pending').length>=state.settings.budget&&j.status==='pending'){toast('Limite da demonstra\u00e7\u00e3o atingido. Ajuste em Configura\u00e7\u00f5es.','info');return}j.status='queued';j.step=0;j.reviewed=false;j.created=now();j.scenario=scenario;save();refreshJobViews();toast('Pesquisa simulada adicionada \u00e0 fila.');const generation=uid('run');j.generation=generation;[1,2,3,4].forEach(step=>setTimeout(()=>{const current=rBy(id);if(!current||current.generation!==generation||current.status==='cancelled')return;if(!state.settings.researchEnabled||nBy(current.noteId)?.status!=='active'){current.status='cancelled';save();refreshJobViews();return}current.status='running';current.step=step;if(step===4){if(scenario==='failure'){current.status='failed';current.failure='O provider simulado retornou indisponibilidade. Nenhuma nota foi alterada.'}else{current.status='completed';const tech=/outbox|fila|mensagen|banco|worker/i.test(current.question+' '+current.quote);if(tech&&scenario!=='none'){const base=seed().jobs[0];current.answer=base.answer;current.sources=base.sources;current.evidence='sourced'}else{current.answer='Sem fonte. Este adaptador de demonstra\u00e7\u00e3o n\u00e3o consulta a internet e n\u00e3o possui evid\u00eancias para responder a esta pergunta. No sistema real, uma busca seria executada e as fontes seriam avaliadas antes da s\u00edntese. Acrescente contexto ou refine a pergunta.';current.sources=[];current.evidence='none'}state.notifications.unshift({title:'Pesquisa conclu\u00edda',text:current.que function defaultGraphBoard(notes, example=false, second=false){
  const active=notes.filter(n=>n.status==='active');
  const showExample=example&&active.some(n=>n.id==='n9');
  const preferred={n9:[140,195],n10:[460,68],n11:[460,330],n12:[790,205]};
  const known=showExample?active.filter(n=>preferred[n.id]):[];
  const others=active.filter(n=>!known.includes(n));
  const placements=[...known.map(n=>({noteId:n.id,x:preferred[n.id][0],y:preferred[n.id][1]})),
    ...others.map((n,i)=>({noteId:n.id,x:125+(i%3)*405,y:(showExample?475:115)+Math.floor(i/3)*210}))];
  const edges=showExample&&!second?[
    {id:'e-sample-a',from:'n9',to:'n10',type:'related',label:''},
    {id:'e-sample-b',from:'n9',to:'n11',type:'related',label:''},
    {id:'e-sample-c',from:'n11',to:'n12',type:'related',label:''}
  ]:[];

    title:second?'Meu aprendizado':showExample?'Política e sociedade':'Meu mapa de ideias',
    description:second?'Um segundo olhar sobre as mesmas notas.':'Conecte conceitos, pesquisas e dúvidas em um espaço seu.',
    placements,edges,suggestions:[],updated:now()};
}

function migrateGraphState(){
  const prior=state.schema===1;
  const showcase=state.graphSampleSeed===true;
  state.notes.forEach(graphReference);
  if(!Array.isArray(state.boards)||!state.boards.length){
    state.boards=[defaultGraphBoard(state.notes,showcase)];
    if(showcase)state.boards.push(defaultGraphBoard(state.notes,false,true));
  }
  state.boards.forEach(board=>{
    board.placements??=[];board.edges??=[];board.suggestions??=[];
    ensureGraphPlacements(board,false);
  });
  delete state.graphSampleSeed;
  state.schema=2;
  if(prior){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{/* armazenamento opcional */}}
}

function ensureGraphPlacements(board,persist=true){
  let added=0;
  for(const note of graphActiveNotes()){
    if(board.placements.some(p=>p.noteId===note.id))continue;
    const i=board.placements.length;
    board.placements.push({noteId:note.id,x:120+(i%4)*295,y:150+Math.floor(i/4)*250});
    added++;
  }
  if(added&&persist)save();
  return added;
}

function graphEdgeMarkup(board,visible){
  return board.edges.filter(edge=>visible.has(edge.from)&&visible.has(edge.to)).map(edge=>{
    const from=graphPlacement(board,edge.from),to=graphPlacement(board,edge.to);
    if(!from||!to)return '';
    const forward=to.x>=from.x;
    const x1=from.x+(forward?graphCardSize.width:0),y1=from.y+graphCardSize.height*.5;
    const x2=to.x+(forward?0:graphCardSize.width),y2=to.y+graphCardSize.height*.5;
    const spread=Math.max(55,Math.abs(x2-x1)*.45);
    const path=`M ${x1} ${y1} C ${x1+(forward?spread:-spread)} ${y1}, ${x2-(forward?spread:-spread)} ${y2}, ${x2} ${y2}`;
    const label=edge.type==='none'&&!edge.label?'':graphLinkName(edge);
    const mx=(x1+x2)/2,my=(y1+y2)/2-13;
    const w=Math.min(164,Math.max(57,label.length*6+18));
    const selected=graphUI.selectedNoteId===edge.from||graphUI.selectedNoteId===edge.to;
    return `<g class="graph-edge ${selected?'edge-related':''}" data-graph-edge="${esc(edge.id)}">
      <path d="${path}" class="graph-edge-line" marker-end="url(#graph-arrow)"/>
      <path d="${path}" class="graph-edge-hit"/>
      ${label?`<rect x="${mx-w/2}" y="${my-13}" width="${w}" height="24" rx="10" class="graph-edge-label-bg"/>
      <text x="${mx}" y="${my+2}" text-anchor="middle" class="graph-edge-text">${esc(label.slice(0,24))}</text>`:''}
      <title>${esc(nBy(edge.from)?.title)} → ${esc(nBy(edge.to)?.title)}: ${esc(label||'ligação sem rótulo')}</title>
    </g>`;
  }).join('');
}

function graphContextForBoard(board){

  const selected=new Set(ids);
  const nodes=ids.map(id=>{
    const note=nBy(id),refs=graphReference(note);
    const jobs=state.jobs.filter(j=>j.noteId===id);
    return {id:note.id,revision:note.version,title:note.title,category:catName(note.category),tags:[...note.tags],
      content:graphNoteText(note),references:{books:refs.books.map(r=>({title:r.title,author:r.author||'',year:r.year||'',url:r.url||''})),
        sources:refs.sources.map(r=>({title:r.title,publisher:r.publisher||'',url:r.url||''}))},
      doubts:jobs.map(j=>({id:j.id,question:j.question,status:j.status,evidence:j.evidence||'pending',
        reviewed:!!j.reviewed,...(j.reviewed&&j.status==='completed'?{reviewedAnswer:j.answer,sources:j.sources}: {})}))};
  });
  const edges=board.edges.filter(e=>selected.has(e.from)&&selected.has(e.to)).map(e=>({

  }));
  return {schema:'notee-graph-context/1',board:{id:board.id,title:board.title},scope:graphUI.scope,
    noteCount:nodes.length,edgeCount:edges.length,nodes,edges};
}

function applyGraphTransform(){
  const stage=$('#graph-stage'),surface=$('#graph-surface');
  if(!stage||!surface)return;
  stage.style.transform=`translate(${graphUI.tx}px,${graphUI.ty}px) scale(${graphUI.scale})`;
  surface.style.backgroundPosition=`${graphUI.tx}px ${graphUI.ty}px`;
  surface.style.backgroundSize=`${23*graphUI.scale}px ${23*graphUI.scale}px`;
  const label=$('#graph-zoom-label');if(label)label.textContent=Math.round(graphUI.scale*100)+'%';
}
function centerGraph(){
  const board=graphBoard(),surface=$('#graph-surface');if(!surface||!board)return;
  const nodes=board.placements.filter(p=>nBy(p.noteId)?.status==='active');
  if(!nodes.length){graphUI.tx=100;graphUI.ty=100;graphUI.scale=1;applyGraphTransform();return}
  const minX=Math.min(...nodes.map(p=>p.x))-35;
  const minY=Math.min(...nodes.map(p=>p.y))-55;
  const maxX=Math.max(...nodes.map(p=>p.x+graphCardSize.width+(state.jobs.some(j=>j.noteId===p.noteId)?195:0)))+35;
  const maxY=Math.max(...nodes.map(p=>Math.max(p.y+graphCardSize.height,p.y+75+Math.max(0,state.jobs.filter(j=>j.noteId===p.noteId).length-1)*61+(state.jobs.some(j=>j.noteId===p.noteId)?52:0))))+35;
  const bounds=surface.getBoundingClientRect();
  graphUI.scale=Math.min(1.05,Math.max(.35,Math.min((bounds.width-45)/(maxX-minX),(bounds.height-72)/(maxY-minY))));
  graphUI.tx=(bounds.width-(maxX-minX)*graphUI.scale)/2-minX*graphUI.scale;
  graphUI.ty=(bounds.height-(maxY-minY)*graphUI.scale)/2-minY*graphUI.scale;
  applyGraphTransform();
}
function graphSetZoom(next,clientX,clientY){
  const surface=$('#graph-surface');if(!surface)return;
  const rect=surface.getBoundingClientRect();
  const px=(clientX??(rect.left+rect.width/2))-rect.left;
  const py=(clientY??(rect.top+rect.height/2))-rect.top;
  const old=graphUI.scale;
  graphUI.scale=Math.min(2.2,Math.max(.30,next));
  graphUI.tx=px-(px-graphUI.tx)*(graphUI.scale/old);
  graphUI.ty=py-(py-graphUI.ty)*(graphUI.scale/old);
  applyGraphTransform();
}

function graphAutoLayout(board){
  const active=graphActiveNotes();
  const byId=new Map(active.map(n=>[n.id,n]));
  const degree=new Map(active.map(n=>[n.id,0]));
  const adjacency=new Map(active.map(n=>[n.id,new Set()]));
  for(const edge of board.edges){
    if(!byId.has(edge.from)||!byId.has(edge.to))continue;
    adjacency.get(edge.from).add(edge.to);adjacency.get(edge.to).add(edge.from);
    degree.set(edge.from,degree.get(edge.from)+1);degree.set(edge.to,degree.get(edge.to)+1);
  }
  const seen=new Set(),layers=[];
  while(seen.size<active.length){
    const root=active.filter(n=>!seen.has(n.id)).sort((a,b)=>(degree.get(b.id)-degree.get(a.id))||a.title.localeCompare(b.title))[0];
    if(!root)break;
    let pending=[root.id];seen.add(root.id);
    while(pending.length){
      layers.push(pending);
      const next=[];
      for(const id of pending){
        for(const related of [...adjacency.get(id)].sort()){
          if(!seen.has(related)){seen.add(related);next.push(related)}
        }
      }
      pending=next;
    }
  }
  // Clusteriza por proximidade e depois distribui em linhas compactas.
  const ordered=layers.flat();
  ordered.forEach((id,i)=>{
    const p=graphPlacement(board,id);
    if(p){p.x=105+(i%3)*405;p.y=115+Math.floor(i/3)*245}
  });
  graphTouchBoard(board);graphUI.centerNext=true;render();
  toast('Mapa reorganizado. Os vínculos e o conteúdo das notas foram preservados.');
}

  }

// Divisorias ajustaveis por mouse, touch, caneta e teclado; configuracao separada do conteudo.
let activePaneResize=null;
function paneConfig(divider){
  const kind=divider.dataset.resizePane;
  const layout=divider.closest(kind==='editor'?'.editor-layout':'.graph-layout');
  if(!layout)return null;
  const width=layout.getBoundingClientRect().width;
  const minimum=270,minimumMain=kind==='editor'?380:380;
  const maximum=Math.max(minimum,width-minimumMain-10);
  return {kind,layout,minimum,maximum,key:kind==='editor'?'editorAsideWidth':'graphAsideWidth',cssName:kind==='editor'?'--editor-aside-width':'--graph-aside-width'};
}
function setPaneWidth(divider,next,finalize=false){
  const cfg=paneConfig(divider);if(!cfg)return;
  const actual=Math.round(clamp(next,cfg.minimum,cfg.maximum));
  cfg.layout.style.setProperty(cfg.cssName,actual+'px');
  divider.setAttribute('aria-valuemin',String(cfg.minimum));
  divider.setAttribute('aria-valuemax',String(cfg.maximum));
  divider.setAttribute('aria-valuenow',String(actual));
  divider.setAttribute('aria-valuetext',actual+' pixels');
  uiPrefs[cfg.key]=actual;
  if(finalize)saveUiPrefs();
}
document.addEventListener('pointerdown',event=>{
  const divider=event.target.closest('[data-resize-pane]');
  if(!divider||event.button!==0)return;
  const cfg=paneConfig(divider);if(!cfg)return;
  event.preventDefault();
  activePaneResize={divider,startX:event.clientX,startWidth:uiPrefs[cfg.key],pointerId:event.pointerId};
  divider.classList.add('is-resizing');
  document.body.classList.add('pane-is-resizing');
  divider.setPointerCapture?.(event.pointerId);
});
document.addEventListener('pointermove',event=>{
  const drag=activePaneResize;if(!drag||event.pointerId!==drag.pointerId)return;
  setPaneWidth(drag.divider,drag.startWidth-(event.clientX-drag.startX));
});
function finishPaneResize(event){
  const drag=activePaneResize;if(!drag||(event?.pointerId!==undefined&&event.pointerId!==drag.pointerId))return;
  setPaneWidth(drag.divider,uiPrefs[paneConfig(drag.divider)?.key],true);
  drag.divider.classList.remove('is-resizing');
  document.body.classList.remove('pane-is-resizing');
  activePaneResize=null;
}
document.addEventListener('pointerup',finishPaneResize);
document.addEventListener('pointercancel',finishPaneResize);
document.addEventListener('keydown',event=>{
  const divider=event.target.closest?.('[data-resize-pane]');
  if(!divider||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  const cfg=paneConfig(divider);if(!cfg)return;
  event.preventDefault();
  const step=event.shiftKey?48:20;
  const next=event.key==='Home'?cfg.minimum:event.key==='End'?cfg.maximum:
    uiPrefs[cfg.key]+(event.key==='ArrowLeft'?step:-step);
  setPaneWidth(divider,next,true);
});

 else if(a==='simulate-failure')runJob(id,'failure');
 else if(a==='cancel-job'){rBy(id).status='cancelled';save();refreshJobViews();toast('Simula\u00e7\u00e3o cancelada. A pergunta continua salva.')}
 else if(a==='review-job'){rBy(id).reviewed=!rBy(id).reviewed;save();refreshJobViews();toast(rBy(id).reviewed?'Resposta marcada como revisada.':'Marca de revis\u00e3o removida.')}
 else if(a==='edit-question'){const j=rBy(id);modal('Refine sua pergunta',`<form id="question-form" data-id="${id}"><div class="field"><label for="refined-question">O que voc\u00ea deseja esclarecer?</label><textarea id="refined-question" required>${esc(j.question)}</textarea></div><div class="callout neutral">${icon('info')}<span>Aqui, refinar substitui o resultado de demonstra\u00e7\u00e3o. No sistema real, cada tentativa ter\u00e1 seu hist\u00f3rico.</span></div><div class="modal-actions"><button class="btn primary" type="submit">Salvar pergunta</button></div></form>`)}
 else if(a==='research-filter'){researchFilter=b.dataset.value;render()}
 else if(a==='settings-tab'){settingTab=b.dataset.value;render()}
 else if(a==='toggle-setting'){state.settings[b.dataset.key]=!state.settings[b.dataset.key];save();render();toast('Prefer\u00eancia salva. Sugest\u00f5es antigas n\u00e3o s\u00e3o executadas automaticamente.')}
 else if(a==='new-category'||a==='edit-category'){const c=state.categories.find(c=>c.id===id);modal(c?'Editar categoria':'Uma nova categoria',`<form id="category-form" data-id="${c?.id||''}"><div class="field"><label for="category-name">Nome</label><input id="category-name" value="${esc(c?.name||'')}" type="text" maxlength="60" required></div><div class="modal-actions"><button class="btn primary" type="submit">Salvar categoria</button></div></form>`)}
 else if(a==='view-category'){filterCategory=id;filterNote='';goto('/notes')}
 else if(a==='search-tag'){searchTerm=b.dataset.value;goto('/search')}
 else if(a==='archive-note'||a==='trash-note'){collectEditor(id,true);confirmAction(a==='archive-note'?'Arquivar esta nota?':'Mover para a lixeira?',`Pesquisas em andamento ser\u00e3o canceladas na simula\u00e7\u00e3o e a publica\u00e7\u00e3o ser\u00e1 retirada do cat\u00e1logo local. Voc\u00ea poder\u00e1 restaurar o rascunho depois.`,a==='archive-note'?'confirm-archive':'confirm-trash',id)}
 else if(a==='confirm-archive'||a==='confirm-trash'){const n=nBy(id);n.status=a==='confirm-archive'?'archived':'trashed';state.jobs.filter(j=>j.noteId===id&&['running','queued'].includes(j.status)).forEach(j=>j.status='cancelled');state.publications=state.publications.filter(p=>p.noteId!==id);save();closeModal();goto(a==='confirm-archive'?'/archive':'/trash');toast('Nota movida. Nenhuma republica\u00e7\u00e3o ser\u00e1 autom\u00e1tica.')}
 else if(a==='restore-note'){nBy(id).status='active';save();render();toast('Nota restaurada, sem republicar ou pesquisar novamente.')}
 else if(a==='delete-note')confirmAction('Excluir definitivamente?',`A nota, suas revis\u00f5es e pesquisas ser\u00e3o removidas deste navegador. Esta a\u00e7\u00e3o n\u00e3o pode ser desfeita no prot\u00f3tipo.`,'confirm-delete',id);
 else if(a==='confirm-delete'){if(nBy(id)?.status!=='trashed'){toast('Somente notas na lixeira podem ser exclu\u00eddas.','info');return}state.notes=state.notes.filter(n=>n.id!==id);state.jobs=state.jobs.filter(j=>j.noteId!==id);state.publications=state.publications.filter(p=>p.noteId!==id);delete state.revisions[id];state.boards.forEach(board=>{board.placements=board.placements.filter(p=>p.noteId!==id);board.edges=board.edges.filter(e=>e.from!==id&&e.to!==id)});save();closeModal();render();toast('Dados da nota exclu\u00eddos da demonstra\u00e7\u00e3o local.')}
 else if(a==='restore-version'){const v=state.revisions[id].find(v=>v.version===Number(b.dataset.version));modal('Restaurar sem apagar a hist\u00f3ria',`<p>A vers\u00e3o ${v.version} ser\u00e1 copiada para uma nova revis\u00e3o da nota. A publica\u00e7\u00e3o atual n\u00e3o muda.</p>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="confirm-version" data-id="${id}" data-version="${v.version}">Restaurar vers\u00e3o</button>`)}
 else if(a==='confirm-version'){const n=nBy(id);const v=state.revisions[id].find(v=>v.version===Number(b.dataset.version));n.version++;n.title=v.title;n.blocks=structuredClone(v.blocks);n.category=v.category;n.tags=[...v.tags];n.updated=now();state.revisions[id].push({version:n.version,title:n.title,blocks:structuredClone(n.blocks),category:n.category,tags:[...n.tags],at:n.updated});save();closeModal();render();toast('Hist\u00f3rico preservado. Uma nova revis\u00e3o foi criada.')}
 else if(a==='conflict-demo')modal('Outra vers\u00e3o foi salva',`<div class="callout warning mb24">${icon('info')}<span>Estado demonstrativo: HTTP 409. O backend rejeitou uma altera\u00e7\u00e3o baseada em revis\u00e3o antiga.</span></div><div class="grid two"><div class="card pad no-shadow"><h4>Sua edi\u00e7\u00e3o</h4><p class="small muted mt16">Mantida localmente para compara\u00e7\u00e3o.</p></div><div class="card pad no-shadow"><h4>Vers\u00e3o do servidor</h4><p class="small muted mt16">A nota foi alterada em outra sess\u00e3o.</p></div></div><p class="small muted mt16">Na implementa\u00e7\u00e3o real, carregue as duas revis\u00f5es e ofere\u00e7a compara\u00e7\u00e3o. Nunca sobrescreva silenciosamente.</p>`,`<button class="btn primary" data-action="close-modal">Manter meu rascunho</button>`);
 else if(a==='unpublish')confirmAction('Retirar a publica\u00e7\u00e3o?',`O rascunho privado ser\u00e1 preservado. Links desta publica\u00e7\u00e3o deixar\u00e3o de funcionar na demonstra\u00e7\u00e3o.`,'confirm-unpublish',id);
 else if(a==='confirm-unpublish'){state.publications=state.publications.filter(p=>p.id!==id);save();closeModal();goto('/publications');toast('Publica\u00e7\u00e3o retirada do cat\u00e1logo local.')}
 else if(a==='copy-public'){const url=location.href.split('#')[0]+'#/public/'+id;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('Link local copiado. Ele n\u00e3o publica na internet.')).catch(()=>modal('Link local',`<input type="text" value="${esc(url)}" readonly aria-label="Link da publica\u00e7\u00e3o local"><p class="small muted mt16">Copie o endere\u00e7o. Funciona apenas onde os dados locais existem.</p>`));else modal('Link local',`<input type="text" value="${esc(url)}" readonly aria-label="Link local"><p class="small muted mt16">Este n\u00e3o \u00e9 um link p\u00fablico de internet.</p>`)}
 else if(a==='notifications')modal('Novidades do seu espa\u00e7o',state.notifications.length?state.notifications.slice(0,6).map(n=>`<a class="source" href="#/research/${n.jobId}" data-close-modal="true">${icon('spark')}<div><strong>${esc(n.title)}</strong><p class="small muted">${esc(n.text)}</p></div></a>`).join(''):'<div class="empty">'+icon('bell')+'<h3>Tudo em dia.</h3><p>As pesquisas conclu\u00eddas nesta simula\u00e7\u00e3o aparecer\u00e3o aqui.</p></div>');
 else if(a==='reset-demo')confirmAction('Recome\u00e7ar a demonstra\u00e7\u00e3o?',`Todas as edi\u00e7\u00f5es locais ser\u00e3o apagadas e substitu\u00eddas pelos exemplos iniciais.`,'confirm-reset');
 else if(a==='confirm-reset'){state=seed();migrateGraphState();save();currentResearch=null;analysisVisible=false;graphUI.boardId=null;graphUI.selection.clear();graphUI.centerNext=true;closeModal();goto('/home');toast('Dados iniciais restaurados.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();goto('/search');setTimeout(()=>$('#global-search')?.focus(),10)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&route.startsWith('/note/')){e.preventDefault();collectEditor(route.split('/')[2]);render()}if(e.key==='Tab'&&$('.modal')){const focusable=$$('a[href],button,input,select,textarea',[...$$('.modal')][0]).filter(el=>!el.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('hashchange',()=>{if(route.startsWith('/note/'))collectEditor(route.split('/')[2],true);selected=null;analysisVisible=false;render();window.scrollTo(0,0)});
window.addEventListener('beforeunload',()=>{if(route.startsWith('/note/'))collectEditor(route.split('/')[2],true)});
migrateGraphState();
render();

</script>
</body>
</html>

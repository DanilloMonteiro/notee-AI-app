name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (.NET 10 + PostgreSQL, ${{ matrix.messaging }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # inprocess: tabela de jobs como fila; sqs: Outbox -> SQS no LocalStack provisionado via Terraform
        messaging: [inprocess, sqs]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notelab_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d notelab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=notelab_ci;Username=postgres;Password=ci
      Jwt__Key: ci-only-key-not-a-secret-but-long-enough-0123456789
      RateLimit__AuthPerMinute: "1000"
      Research__PollSeconds: "1"
      Research__MaxJobsPerHour: "5"
      Messaging__Provider: ${{ matrix.messaging }}
      # Provider externo apontado para o servidor FALSO da suíte provider.test.mjs (nenhuma chamada real)
      Gemini__ApiKey: fake-key
      Gemini__BaseUrl: http://localhost:5199
      # Painel admin + adaptadores apontados para o servidor FALSO da suíte admin.test.mjs (nenhuma chamada real)
      Admin__Email: admin@notee.local
      Admin__Password: Admin!Teste123
      OpenAI__ApiKey: fake-key
      OpenAI__BaseUrl: http://localhost:5198
      Grok__ApiKey: fake-key
      Grok__BaseUrl: http://localhost:5198
      DeepSeek__BaseUrl: http://localhost:5198
      Claude__ApiKey: fake-key
      Claude__BaseUrl: http://localhost:5198
      Messaging__Sqs__ServiceUrl: http://localhost:4566
      Messaging__Sqs__QueueUrl: http://localhost:4566/000000000000/notee-research-jobs
      DOTNET_NOLOGO: "true"
    defaults:
      run:
        working-directory: Notee-API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        if: matrix.messaging == 'sqs'
        with:
          terraform_wrapper: false

      - name: LocalStack + Terraform (SQS)
        if: matrix.messaging == 'sqs'
        working-directory: infra/terraform/localstack
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=sqs localstack/localstack:4.4
          for i in $(seq 1 60); do curl -s localhost:4566/_localstack/health | grep -Eq '"sqs": "(available|running)"' && break; sleep 2; done
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Unit tests
        run: dotnet test tests/NoteLab.Tests/NoteLab.Tests.csproj --nologo

      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef database update --project src/NoteLab --connection "$ConnectionStrings__Default"

      - name: Start API
        run: |
          nohup dotnet run --project src/NoteLab --no-launch-profile --urls http://localhost:5099 > api.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5099/boards || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          cat api.log; exit 1

      - name: HTTP integration suites
        run: NOTEE_API=http://localhost:5099 node tests/http/run-all.mjs

      - name: API log on failure
        if: failure()
        run: cat api.log || true

  front:
    name: Front (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Notee-Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Notee-Front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Docker images (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API runtime
        run: docker build --target runtime -t notee-api:ci Notee-API
      - name: Migrations bundle
        run: docker build --target migrate -t notee-migrate:ci Notee-API
      - name: Front
        run: docker build -t notee-front:ci Notee-Front
